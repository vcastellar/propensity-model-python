[project]
name = "propensity-model-python"
version = "0.1.0"
description = "End-to-end customer propensity modelling pipeline built with Python and scikit-learn"
readme = "README.md"
authors = [
    { name = "vcastellar", email = "vic.sebastia@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[project.scripts]
propensity-model-python = "propensity_model_python:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
